  game_mode_suspend_behavior: Game Mode widget behavior
  game_mode_suspend_behavior_description: >-
    Controls what Seelen does while Windows Game Mode is active. "Keep task switcher"
    leaves Alt+Tab available, while "Pause Alt+Tab capture" disables Seelen's task-switcher
    hotkeys so Windows handles the switch.
  game_mode_suspend_behavior_options:
    keep_task_switcher: Keep task switcher available
    pause_alt_tab_capture: Pause Alt+Tab capture
    suspend_all: Suspend all widgets
  hardware_acceleration: Hardware acceleration
  hardware_acceleration_description: >-
    Disabling hardware acceleration will reduce memory usage. It is safe to
    disable if you are not using heavy animations, though individual widgets may
    still force GPU usage regardless of this setting.
